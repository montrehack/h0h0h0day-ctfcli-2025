<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gift Assignment Portal{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #16213e;
            color: #eee;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #16213e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #0f3460;
            margin-bottom: 30px;
        }
        
        .tree {
            color: #2d6a4f;
            font-size: 20px;
            line-height: 1.2;
            display: inline-block; 
        }
        
        h1 {
            color: #e94560;
            margin: 15px 0;
        }
        
        /* CORRECTION ICI : Assure que tous les liens sont visibles */
        a {
            color: #e94560; 
            text-decoration: none;
        }

        a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #0f3460;
            border: 1px solid #533483;
            color: #eee;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button, .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        
        button:hover, .btn:hover {
            background: #c93a52;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #0f3460;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: #0f3460;
        }
        
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        
        .success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid #51cf66;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        
        .nav {
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid #0f3460;
        }
        
        .nav a {
            /* Garde la couleur de navigation spécifique si besoin, mais l'héritage fonctionne maintenant */
            text-decoration: none;
            margin-right: 20px;
        }
        
        .hint {
            background: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 15px;
            margin: 20px 0;
        }
        
        code {
            background: #0f3460;
            padding: 2px 6px;
            border-radius: 3px;
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <pre class="tree">
    *
   ***
  *****
 *******
*********
   |||
            </pre>
            <h1>{% block header %}🎅 Gift Assignment Portal{% endblock %}</h1>
        </div>
        
     {% if session.get('username') %}
<div class="nav">
    <span>👤 {{ session['username'] }}{% if session.get('is_santa') %} 🎅{% endif %}</span> | 
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('search') }}">Search</a>
    <a href="{{ url_for('assign_gift') }}">Assign Gift</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>
{% endif %}
</div>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
