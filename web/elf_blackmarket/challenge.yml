name: "Elves' Black Market"
author: "Monchou"
description: |
  With all the tarrifs and trade wars going on, toys are getting more expensive and Santa is looking for ways to cut costs, notably by reducing the salary of its elves. 
  To make ends meet, some of them have started a side business selling toys online to naughty "kids" all around the world.

